name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  adapter-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile integration
        run: python -m compileall -q custom_components tests
      - name: Run inventory simulation
        run: python tests/test_inventory.py
      - name: Run event tracker simulation
        run: python tests/test_events.py
      - name: Run coordinator event simulation
        run: python tests/test_coordinator.py
      - name: Run sensor simulation
        run: python tests/test_sensor.py
      - name: Run retention planner simulation
        run: python tests/test_retention.py
      - name: Run adapter simulation
        run: python tests/test_adapter.py
