create:
  fields:
    agent_ids:
      required: true
      example:
        - hassio.local
        - s3_compatible.example
      selector:
        text:
          multiple: true
    include_homeassistant:
      default: true
      selector:
        boolean:
    include_database:
      default: true
      selector:
        boolean:
    include_all_addons:
      default: false
      selector:
        boolean:
    include_addons:
      example:
        - core_mosquitto
      selector:
        text:
          multiple: true
    include_folders:
      selector:
        select:
          multiple: true
          options:
            - label: Share
              value: share
            - label: Local add-ons
              value: addons/local
            - label: SSL
              value: ssl
            - label: Media
              value: media
    job_id:
      example: full
      selector:
        text:
    name:
      selector:
        text:
    password:
      selector:
        text:
          type: password

delete:
  fields:
    backup_id:
      required: true
      selector:
        text:
    agent_ids:
      selector:
        text:
          multiple: true

refresh: {}

list_agents: {}

list_backups: {}

get_backup:
  fields:
    backup_id:
      required: true
      selector:
        text:

plan_retention:
  fields:
    source_type:
      required: true
      selector:
        select:
          options:
            - label: BMA
              value: bma
            - label: HA Native
              value: ha_native
            - label: App Update
              value: app_update
    job_id:
      selector:
        text:
    group_by:
      selector:
        select:
          options:
            - label: Per App
              value: app
            - label: All Apps
              value: all
    agent_ids:
      selector:
        text:
          multiple: true
    keep_last:
      default: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box
    daily:
      default: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box
    weekly:
      default: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box
    monthly:
      default: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box
    yearly:
      default: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box

